apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: build-test
  namespace: tekton-ci
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-path-change: "[\"images/**\"]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  taskRunTemplate:
    serviceAccountName: build-test
  pipelineSpec:
    params:
      - name: image-name
        description: subdirectory under images/ that changed, also used as the Harbor image name
    workspaces:
      - name: source
    tasks:
      - name: fetch-source
        taskRef:
          resolver: hub
          params:
            - name: name
              value: git-clone
            - name: version
              value: "0.10.0"
        workspaces:
          - name: output
            workspace: source
        params:
          - name: url
            value: "{{ repo_url }}"
          - name: revision
            value: "{{ revision }}"
      - name: build-test
        runAfter: ["fetch-source"]
        taskRef:
          resolver: hub
          params:
            - name: name
              value: buildah
            - name: version
              value: "0.9.0"
        workspaces:
          - name: source
            workspace: source
        params:
          - name: IMAGE
            value: "harbor.lab.garrettholland.com/library/$(params.image-name):pr-test"
          - name: CONTEXT
            value: "images/$(params.image-name)"
          - name: SKIP_PUSH
            value: "true"
  params:
    - name: image-name
      # Same known gap as build-and-push.yaml - see kubernetes/tekton/README.md.
      value: "steam-cmd"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
