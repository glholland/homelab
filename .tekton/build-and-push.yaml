apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: build-and-push
  namespace: tekton-ci
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-path-change: "[\"images/**\"]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  taskRunTemplate:
    serviceAccountName: harbor-push
  pipelineSpec:
    params:
      - name: image-name
        description: subdirectory under images/ that changed, also used as the Harbor image name
    workspaces:
      - name: source
    tasks:
      - name: fetch-source
        taskRef:
          resolver: hub
          params:
            - name: name
              value: git-clone
            - name: version
              value: "0.10.0"
        workspaces:
          - name: output
            workspace: source
        params:
          - name: url
            value: "{{ repo_url }}"
          - name: revision
            value: "{{ revision }}"
      - name: build-and-push
        runAfter: ["fetch-source"]
        taskRef:
          resolver: hub
          params:
            - name: name
              value: buildah
            - name: version
              value: "0.9.0"
        workspaces:
          - name: source
            workspace: source
        params:
          - name: IMAGE
            value: "harbor.lab.garrettholland.com/library/$(params.image-name):latest"
          - name: CONTEXT
            value: "images/$(params.image-name)"
  params:
    - name: image-name
      # NOTE: on-path-change scopes this PipelineRun to images/**, but Tekton has no built-in
      # "which subdirectory changed" param -- until that's wired up (a small script step reading
      # `{{ files_changed_added_or_modified }}`), this needs to be set per image or the pipeline
      # generalized to loop over changed images. Left as a known gap, see kubernetes/tekton/README.md.
      value: "steam-cmd"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
