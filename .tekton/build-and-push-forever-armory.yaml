apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: build-and-push-forever-armory
  namespace: tekton-ci
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-path-change: "[\"images/forever-armory/**\"]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  taskRunTemplate:
    serviceAccountName: harbor-push
  pipelineSpec:
    params:
      - name: image-name
        description: subdirectory under images/ that changed, also used as the Harbor image name
    workspaces:
      - name: source
    tasks:
      - name: fetch-source
        taskRef:
          resolver: hub
          params:
            - name: name
              value: git-clone
            - name: version
              value: "0.10.0"
        workspaces:
          - name: output
            workspace: source
        params:
          - name: url
            value: "{{ repo_url }}"
          - name: revision
            value: "{{ revision }}"
      - name: build-and-push
        runAfter: ["fetch-source"]
        taskRef:
          resolver: hub
          params:
            - name: name
              value: buildah
            - name: version
              value: "0.9.0"
        workspaces:
          - name: source
            workspace: source
        params:
          - name: IMAGE
            value: "harbor.lab.garrettholland.com/library/$(params.image-name):latest"
          - name: CONTEXT
            value: "images/$(params.image-name)"
          # buildah >= 1.43 overlay-mounts the build context, which fails on the
          # truenas-nfs workspace ("mount overlay ... invalid argument"). 1.42.2 works.
          - name: BUILDER_IMAGE
            value: "quay.io/buildah/stable:v1.42.2"
  params:
    - name: image-name
      value: "forever-armory"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
