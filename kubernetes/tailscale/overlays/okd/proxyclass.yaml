apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: subnet-router
spec:
  statefulSet:
    pod:
      securityContext:
        sysctls:
          - name: net.ipv4.ip_forward
            value: "1"
          - name: net.ipv6.conf.all.forwarding
            value: "1"
      tailscaleContainer:
        securityContext:
          privileged: false
          capabilities:
            add: ["NET_ADMIN", "NET_RAW"]
      tailscaleInitContainer:
        securityContext:
          privileged: false
          capabilities:
            add: ["NET_ADMIN", "NET_RAW"]
