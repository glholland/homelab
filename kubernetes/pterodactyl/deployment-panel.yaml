# NOTE: image harbor.lab.garrettholland.com/library/pterodactyl-panel:1.11.11-homelab-2
# is a custom, hand-built image on the private (internal-only) Harbor registry.
# There is no Containerfile/build pipeline for it in this repo -- applying this
# manifest elsewhere will fail to pull the image unless that image is rebuilt
# and pushed to an equivalent registry. See report for details.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pterodactyl-panel
  namespace: pterodactyl
  labels:
    app.kubernetes.io/component: panel
    app.kubernetes.io/name: pterodactyl-panel
    app.kubernetes.io/part-of: pterodactyl
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pterodactyl-panel
  template:
    metadata:
      labels:
        app.kubernetes.io/component: panel
        app.kubernetes.io/name: pterodactyl-panel
        app.kubernetes.io/part-of: pterodactyl
    spec:
      serviceAccountName: pterodactyl-apps
      initContainers:
        - name: wait-for-mariadb
          image: docker.io/library/mariadb:11.4
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until mariadb-admin ping \
                --protocol=tcp \
                -h pterodactyl-mariadb \
                -u pterodactyl \
                -p"$DB_PASSWORD" \
                --silent; do
                echo "waiting for mariadb"
                sleep 5
              done
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pterodactyl-panel-secret
                  key: DB_PASSWORD
        - name: wait-for-redis
          image: docker.io/library/redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until redis-cli -h pterodactyl-redis ping | grep -q PONG; do
                echo "waiting for redis"
                sleep 5
              done
      containers:
        - name: panel
          image: harbor.lab.garrettholland.com/library/pterodactyl-panel:1.11.11-homelab-2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pterodactyl-panel-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: pterodactyl-panel-secret
                  key: APP_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pterodactyl-panel-secret
                  key: DB_PASSWORD
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pterodactyl-panel-secret
                  key: MAIL_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/www/pterodactyl/storage
              subPath: storage
            - name: data
              mountPath: /var/www/pterodactyl/bootstrap/cache
              subPath: bootstrap-cache
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pterodactyl-panel-data
