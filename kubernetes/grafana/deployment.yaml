apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: grafana
  name: grafana
  namespace: grafana
spec:
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: harbor.lab.garrettholland.com/library/grafana:13.0.1-security-01
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http-grafana
              protocol: TCP
          env:
            - name: GF_OKD_PROMETHEUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-monitor-token
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /robots.txt
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 3000
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 250m
              memory: 750Mi
            limits:
              cpu: 1000m
              memory: 4096Mi
          volumeMounts:
            - mountPath: /var/lib/grafana
              name: grafana-pv
            - mountPath: /etc/grafana/provisioning/datasources
              name: grafana-datasources
              readOnly: true
            - mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              name: grafana-dashboard-provisioning
              subPath: dashboards.yaml
              readOnly: true
            - mountPath: /etc/grafana/provisioning/dashboards/router.json
              name: grafana-dashboard-router
              subPath: router.json
              readOnly: true
            - mountPath: /etc/grafana/provisioning/dashboards/unifi-aps.json
              name: grafana-dashboard-unifi-aps
              subPath: unifi-aps.json
              readOnly: true
            - mountPath: /etc/grafana/provisioning/dashboards/vm-unifi-aps.json
              name: grafana-dashboard-vm-unifi-aps
              subPath: vm-unifi-aps.json
              readOnly: true
            - mountPath: /etc/grafana/provisioning/dashboards/vm-router.json
              name: grafana-dashboard-vm-router
              subPath: vm-router.json
              readOnly: true
            - mountPath: /etc/grafana/provisioning/dashboards/okd.json
              name: grafana-dashboard-okd
              subPath: okd.json
              readOnly: true
      volumes:
        - name: grafana-pv
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-provisioning
          configMap:
            name: grafana-dashboard-provisioning
        - name: grafana-dashboard-router
          configMap:
            name: grafana-dashboard-router
        - name: grafana-dashboard-unifi-aps
          configMap:
            name: grafana-dashboard-unifi-aps
        - name: grafana-dashboard-vm-unifi-aps
          configMap:
            name: grafana-dashboard-vm-unifi-aps
        - name: grafana-dashboard-vm-router
          configMap:
            name: grafana-dashboard-vm-router
        - name: grafana-dashboard-okd
          configMap:
            name: grafana-dashboard-okd
