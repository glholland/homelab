apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/component: pvr
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarr
        app.kubernetes.io/component: pvr
        app.kubernetes.io/part-of: media-stack
    spec:
      serviceAccountName: media-apps
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:4.0.19
          ports:
            - name: http
              containerPort: 8989
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Detroit
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tvshows
              mountPath: /tvshows
            - name: incomplete
              mountPath: /incomplete
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: tvshows
          persistentVolumeClaim:
            claimName: media-tvshows
        - name: incomplete
          persistentVolumeClaim:
            claimName: media-incomplete
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: media
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/part-of: media-stack
spec:
  selector:
    app.kubernetes.io/name: sonarr
  ports:
    - name: http
      port: 8989
      targetPort: 8989
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr
  namespace: media
  labels:
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/part-of: media-stack
    external-dns: enabled
  annotations:
    route.openshift.io/termination: edge
    external-dns.alpha.kubernetes.io/hostname: sonarr.garrettholland.com
    external-dns.alpha.kubernetes.io/target: 10.0.0.253
spec:
  ingressClassName: openshift-default
  rules:
    - host: sonarr.garrettholland.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarr
                port:
                  name: http
  tls:
    - hosts:
        - sonarr.garrettholland.com
      secretName: sonarr-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sonarr-cert
  namespace: media
  labels:
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/part-of: media-stack
spec:
  secretName: sonarr-tls
  dnsNames:
    - sonarr.garrettholland.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
