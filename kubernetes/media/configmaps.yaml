apiVersion: v1
kind: ConfigMap
metadata:
  name: backlog-search-script
  namespace: media
  labels:
    app.kubernetes.io/name: backlog-search
    app.kubernetes.io/part-of: media-stack
data:
  search.sh: |
    #!/bin/sh
    set -eu
    apk add --no-cache curl jq >/dev/null

    RADARR_URL="http://radarr.media.svc:7878"
    SONARR_URL="http://sonarr.media.svc:8989"
    BATCH_SIZE=5

    echo "=== Radarr: searching next $BATCH_SIZE missing movies ==="
    MOVIE_IDS=$(curl -s "$RADARR_URL/api/v3/wanted/missing?pageSize=$BATCH_SIZE&apikey=$RADARR_API_KEY" | jq -c '[.records[].id]')
    if [ "$MOVIE_IDS" != "[]" ] && [ -n "$MOVIE_IDS" ]; then
      curl -s -X POST "$RADARR_URL/api/v3/command" \
        -H "Content-Type: application/json" -H "X-Api-Key: $RADARR_API_KEY" \
        -d "{\"name\":\"MoviesSearch\",\"movieIds\":$MOVIE_IDS}" >/dev/null
      echo "triggered search for movie ids: $MOVIE_IDS"
    else
      echo "no missing movies"
    fi

    echo "=== Sonarr: searching next $BATCH_SIZE missing episodes ==="
    EP_IDS=$(curl -s "$SONARR_URL/api/v3/wanted/missing?pageSize=$BATCH_SIZE&apikey=$SONARR_API_KEY" | jq -c '[.records[].id]')
    if [ "$EP_IDS" != "[]" ] && [ -n "$EP_IDS" ]; then
      curl -s -X POST "$SONARR_URL/api/v3/command" \
        -H "Content-Type: application/json" -H "X-Api-Key: $SONARR_API_KEY" \
        -d "{\"name\":\"EpisodeSearch\",\"episodeIds\":$EP_IDS}" >/dev/null
      echo "triggered search for episode ids: $EP_IDS"
    else
      echo "no missing episodes"
    fi
---
