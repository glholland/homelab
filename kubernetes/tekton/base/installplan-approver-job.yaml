apiVersion: batch/v1
kind: Job
metadata:
  name: approve-okd-pipelines-operator-installplan
  namespace: openshift-operators
  labels:
    app.kubernetes.io/instance: tekton
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: tekton
    spec:
      serviceAccountName: installplan-approver
      restartPolicy: Never
      containers:
        - name: approve
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 30); do
                ip=$(oc get subscription okd-pipelines-operator -n openshift-operators -o jsonpath='{.status.installPlanRef.name}' 2>/dev/null || true)
                if [ -n "$ip" ]; then
                  oc patch installplan "$ip" -n openshift-operators --type merge -p '{"spec":{"approved":true}}'
                  echo "approved $ip"
                  exit 0
                fi
                echo "waiting for installplan ($i/30)..."
                sleep 10
              done
              echo "timed out waiting for installplan" >&2
              exit 1
