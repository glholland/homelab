# Lets the BuildConfig push to Harbor: the same robot account Tekton uses
# (kubernetes/tekton/components/pipelines-as-code/harbor-push-secret.yaml),
# injected by argocd-vault-plugin. Pulls need nothing: Harbor's library project is public.
apiVersion: v1
kind: Secret
metadata:
  name: harbor-push-secret
  namespace: forever-armory
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"harbor.lab.garrettholland.com":{"username":"<path:projects/812524172865/secrets/harbor-ci-robot-username#harbor-ci-robot-username>","password":"<path:projects/812524172865/secrets/harbor-ci-robot-password#harbor-ci-robot-password>"}}}
