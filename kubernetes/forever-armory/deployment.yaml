apiVersion: apps/v1
kind: Deployment
metadata:
  name: forever-armory
  namespace: forever-armory
  labels:
    app.kubernetes.io/name: forever-armory
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forever-armory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forever-armory
    spec:
      automountServiceAccountToken: false
      containers:
        - name: forever-armory
          # Built from images/forever-armory by .tekton/build-and-push-forever-armory.yaml.
          image: harbor.lab.garrettholland.com/library/forever-armory:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WOW_REGION
              value: us
            - name: CACHE_SECONDS
              value: "300"
          envFrom:
            - secretRef:
                name: blizzard-api
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
