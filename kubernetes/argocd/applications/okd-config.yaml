apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: okd-config
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/glholland/homelab
    targetRevision: main
    path: okd/config/base
    plugin:
      name: kustomize-avp
  destination:
    server: https://kubernetes.default.svc
