apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forever-armory
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/glholland/homelab
    targetRevision: main
    path: kubernetes/forever-armory
    plugin:
      name: kustomize-avp
  destination:
    server: https://kubernetes.default.svc
    namespace: forever-armory
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    # The controller's RBAC for ingresses syncs in a separate app;
    # retry rather than stay failed if this one goes first.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
