# https://docs.openshift.com/container-platform/latest/networking/ingress-operator.html#configuring-ingress-controller
apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: default
  namespace: openshift-ingress-operator
  annotations:
    ingress.operator.openshift.io/default-enable-http2: "true"
  labels:
    app.kubernetes.io/instance: okd-configuration
spec:
  clientTLS:
    clientCA:
      name: ""
    clientCertificatePolicy: ""
  closedClientConnectionPolicy: Continue
  defaultCertificate:
    name: okd-ingress-cert-tls
  httpCompression: {}
  httpEmptyRequestsPolicy: Respond
  httpErrorCodePages:
    name: ""
  idleConnectionTerminationPolicy: Immediate
  replicas: 3
  routeAdmission:
    wildcardPolicy: WildcardsAllowed
  tuningOptions:
    reloadInterval: 0s
